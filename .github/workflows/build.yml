          done

  merge-wheels:
    runs-on: ubuntu-latest
    needs: [
      build-linux,
      build-windows,
      build-macos-arm,
      build-macos-intel,
    ]
    steps:
      - name: Merge all wheel artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: wheels
          pattern: wheels-*
          delete-merged: false  # Optional: removes the individual artifacts

  setup-tests-cache:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Restore cached tests setup
        id: cache-tests-setup-restore
        uses: actions/cache/restore@v4
        with:
          key: tests-setup-${{ hashFiles('Justfile') }}-v1
          path: |
            tests/*.onnx
            tests/*.onnx.json
            tests/kaldi_model

      - name: Setup tests
        if: steps.cache-tests-setup-restore.outputs.cache-hit != 'true'
        run: |
          just setup-tests

      - name: Save cached tests setup
        if: steps.cache-tests-setup-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.cache-tests-setup-restore.outputs.cache-primary-key }}
          path: |
            tests/*.onnx
            tests/*.onnx.json
            tests/kaldi_model

  test-wheels-linux:
    runs-on: ${{ matrix.os }}
    needs:
      - build-linux
      - setup-tests-cache
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]  # 3.14 doesn't have piper-tts wheels yet
    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Download Linux wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux
          path: wheels/

      - name: Restore cached tests setup
        uses: actions/cache/restore@v4
        with:
          key: tests-setup-${{ hashFiles('Justfile') }}-v1
          path: |
            tests/*.onnx
            tests/*.onnx.json
            tests/kaldi_model
          fail-on-cache-miss: true

      - name: Run Linux wheel tests
        run: just test-package

  test-wheels-windows:
    runs-on: ${{ matrix.os }}
    needs:
      - build-windows
      - setup-tests-cache
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]  # 3.14 doesn't have piper-tts wheels yet
    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Download Windows wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: wheels/

      - name: Restore cached tests setup
        uses: actions/cache/restore@v4
        with:
          key: tests-setup-${{ hashFiles('Justfile') }}-v1
          path: |
            tests/*.onnx
            tests/*.onnx.json
            tests/kaldi_model
          fail-on-cache-miss: true

      - name: Run Windows wheel tests
        # Must ignore warnings for piper-tts on Github Actions Windows runners
        run: just test-package -v -W 'ignore:Unsupported Windows version (2022server). ONNX Runtime supports Windows 10 and above, only.:UserWarning' -W 'ignore:Unsupported Windows version (2025server). ONNX Runtime supports Windows 10 and above, only.:UserWarning'

